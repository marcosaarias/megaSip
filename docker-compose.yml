services:
  flaskapp:
    build: .
    container_name: MegaSIP
    ports:
      - "5008:5012"
    volumes:
      - .:/app
      - /mnt/base_ventas:/mnt/excel
    environment:
      - FLASK_ENV=production
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sip
      - DB_USER=sip_user
      - DB_PASSWORD=Alberdi2026_db
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7
    container_name: redis_server
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    container_name: sip_postgres
    restart: always
    environment:
      POSTGRES_DB: sip
      POSTGRES_USER: sip_user
      POSTGRES_PASSWORD: TuPasswordSegura
    volumes:
      - sip_postgres_data:/var/lib/postgresql/data

volumes:
  sip_postgres_data: