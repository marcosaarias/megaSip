{% extends "base.html" %}
{% block title %}Ecommerce Cenefas{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4">Ecommerce Cenefas</h2>

    <div class="card p-4 shadow-sm mb-4">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label font-weight-bold">Origen:</label>
                    <select name="tipo_origen" class="form-control" required>
                        <option value="todos">Todos</option>
                        <option value="minorista">Minorista</option>
                        <option value="diario">Diario</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label font-weight-bold">Vigencia Desde:</label>
                    <input type="date" name="fecha_desde" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label font-weight-bold">Vigencia Hasta:</label>
                    <input type="date" name="fecha_hasta" class="form-control" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-sys w-100">
                <i class="fas fa-cogs"></i> Obtener Datos
            </button>
        </form>
    </div>

    {% if preview %}
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Previsualización</h5>

            {% if cache_id %}
            <a href="{{ url_for('ecommerce_cenefas.descargar_cenefas', cache_id=cache_id) }}" class="btn btn-success btn-sm">
                <i class="fas fa-file-excel"></i> Descargar archivo
            </a>
            {% endif %}
        </div>

        <div class="card-body">
            <div class="mb-2 text-end">
                <strong>Total registros:</strong> {{ total_registros }}
            </div>

            <div class="tabla-scroll">
                    {{ preview | safe }}
            </div>

            <div class="mt-3 d-flex justify-content-center">
                <button type="button" class="btn btn-warning btn-sm" disabled>
                    <i class="fas fa-paper-plane"></i> Transmitir Precios Tachados
                </button>
            </div>

        </div>
    </div>
    {% endif %}
</div>

<style>
    .tabla-scroll {
        max-height: 500px;
        overflow: auto;
        border: 1px solid #ddd;
    }

    .tabla-scroll table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }

    .tabla-scroll thead th {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #212529;
        color: white;
        padding: 0.6rem;
    }

    .tabla-scroll td {
        padding: 0.5rem;
        vertical-align: middle;
    }
</style>
{% endblock %}
