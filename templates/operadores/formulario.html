{% extends "base.html" %}
{% block title %}Informe - Central de Monitoreo{% endblock %}

{% block content %}

<style>
    .hoja {
        width: 794px;
        min-height: 1123px;
        background: white;
        margin: auto;
        border: 3px solid #f2b400;
        padding: 12px;
        box-sizing: border-box;
    }

    .encabezado {
        display: grid;
        grid-template-columns: 140px 1fr 185px;
        gap: 8px;
        align-items: stretch;
    }

    .logo-box {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo-box img {
        max-width: 120px;
        max-height: 55px;
    }

    .titulo-box,
    .datos-box,
    .sucursal-box,
    .pie {
        border: 2px solid #f2b400;
        border-radius: 8px;
        box-sizing: border-box;
    }

    .titulo-box {
        text-align: center;
        font-weight: bold;
        padding-top: 12px;
        font-size: 14px;
        line-height: 18px;
    }

    .datos-box {
        padding: 8px 12px;
        font-weight: bold;
        font-size: 13px;
        line-height: 28px;
    }

    .datos-box input {
        width: 95px;
    }

    .sucursal-box {
        margin-top: 6px;
        width: 100%;
        padding: 8px 12px;
        font-weight: bold;
        font-size: 13px;

        display: flex;
        align-items: center;
        gap: 30px;
    }

    .sucursal-box select {
        border: none;
        outline: none;
        font-weight: bold;
        font-size: 13px;
        background: transparent;
    }

    .sucursal-box input {
        min-width: 180px;
    }

    .hoja input {
        border: none;
        outline: none;
        font-weight: bold;
        font-size: 13px;
        background: transparent;
    }

    .texto {
        margin-top: 30px;
        margin-left: 65px;
        font-weight: bold;
        font-size: 12px;
    }

    textarea {
        width: calc(100% - 80px);
        height: 820px;
        margin: 15px 40px 0 40px;
        border: none;
        outline: none;
        resize: none;
        font-size: 15px;
        font-family: Arial, Helvetica, sans-serif;
    }

    .pie {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-top: 10px;
        padding: 5px 8px;
        font-weight: bold;
        font-size: 12px;
    }

    .pie input {
        width: 250px;
    }

    .btn-generar {
        margin-top: 15px;
        width: 100%;
        padding: 14px;
        background: #111;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-generar:hover {
        background: #333;
    }
</style>

<form class="hoja" action="{{ url_for('operadores.generar') }}" method="post">

    <div class="encabezado">
        <div class="logo-box">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Alberdi">
        </div>

        <div class="titulo-box">
            INFORME<br>
            CENTRAL DE MONITOREO
        </div>

        <div class="datos-box">
            Nº: <input type="text" name="nro" value="{{ nro_preview }}" readonly><br>
            FECHA: <input type="date" name="fecha" required><br>
            HORA: <input type="time" name="hora" required>
        </div>
    </div>

    <div class="sucursal-box">
        
    <div>
        <label><strong>SUCURSAL:</strong></label>
        <select name="sucursal" required>
            <option value="">Seleccione una sucursal</option>

            <option value="Administracion">Administracion</option>
            
            <!-- Comodines -->
            <option value="Comodin 1">Comodin 1</option>
            <option value="Comodin 2">Comodin 2</option>
            <option value="Comodin 3">Comodin 3</option>
            <option value="Comodin 4">Comodin 4</option>
            <option value="Comodin 5">Comodin 5</option>
            <option value="Comodin 6">Comodin 6</option>
            <option value="Comodin 7">Comodin 7</option>
            <option value="Comodin 8">Comodin 8</option>
            <option value="Comodin 9">Comodin 9</option>
            <option value="Comodin 10">Comodin 10</option>
            <option value="Comodin 11">Comodin 11</option>
            <option value="Comodin 12">Comodin 12</option>
            <option value="Comodin 13">Comodin 13</option>
            <option value="Comodin 14">Comodin 14</option>
            <option value="Comodin 15">Comodin 15</option>
            <option value="Comodin 16">Comodin 16</option>
            <option value="Comodin 17">Comodin 17</option>
            <option value="Comodin 18">Comodin 18</option>
            <option value="Comodin 19">Comodin 19</option>
            <option value="Comodin 20">Comodin 20</option>
            <option value="Comodin 21">Comodin 21</option>
            <option value="Comodin 22">Comodin 22</option>
            <option value="Comodin 23">Comodin 23</option>
            <option value="Comodin 24">Comodin 24</option>
            <option value="Comodin 25">Comodin 25</option>
            <option value="Comodin 26">Comodin 26</option>
            <option value="Comodin 27">Comodin 27</option>
            <option value="Comodin 28">Comodin 28</option>
            <option value="Comodin 29">Comodin 29</option>

            <!-- Mayorista -->
            <option value="Mayorista 2">Mayorista 2</option>

            <!-- Centro de Distribución -->
            <option value="Centro de Distribucion">Centro de Distribucion</option>

            <!-- Boticas -->
            <option value="Botica 1">Botica 1</option>
            <option value="Botica 2">Botica 2</option>
            <option value="Botica 3">Botica 3</option>
            <option value="Botica 4">Botica 4</option>
            <option value="Botica 5">Botica 5</option>
            <option value="Botica 6">Botica 6</option>

            <!-- Sino Motors -->
            <option value="Sino Motors 1">Sino Motors 1</option>
            <option value="Sino Motors 2">Sino Motors 2</option>
        </select>
    </div>

        <div>
            <label><strong>Tipo de Informe:</strong></label>

            <select name="tipo_informe" required
                    style="border:none; font-weight:bold; background:transparent;">
                <option value="">Seleccionar</option>
                <option value="Hurto">Hurto</option>
                <option value="Personal interno y externo">Personal interno y externo</option>
                <option value="Consumo">Consumo</option>
                <option value="Catastrofes">Catastrofes</option>
                <option value="Rotura">Rotura</option>
            </select>
        </div>

    </div>

    <div class="texto">
        Por la presente se informa que:
    </div>

    <textarea name="mensaje" required></textarea>

    <div class="pie">
        <div>
            Operador:
            <input type="text" name="operador" required>
        </div>

        <div>
            Para:
            <select name="para" required>
                <option value="">Seleccione una opción</option>
                <option value="Personal">Personal</option>
                <option value="RR HH">RR HH</option>
                <option value="Directorio">Directorio</option>
                <option value="Gerencia CCTV">Gerencia CCTV</option>
            </select>
        </div>

    </div>

    <button type="submit" class="btn-generar">
        Generar y Descargar PDF
    </button>

</form>

{% endblock %}
