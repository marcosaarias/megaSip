{% extends "base.html" %}
{% block title %}Informe - Central de Monitoreo{% endblock %}

{% block content %}

<style>
    .hoja {
        width: 794px;
        min-height: 1123px;
        background: white;
        margin: auto;
        border: 3px solid #f2b400;
        padding: 12px;
        box-sizing: border-box;
    }

    .encabezado {
        display: grid;
        grid-template-columns: 140px 1fr 185px;
        gap: 8px;
        align-items: stretch;
    }

    .logo-box {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo-box img {
        max-width: 120px;
        max-height: 55px;
    }

    .titulo-box,
    .datos-box,
    .sucursal-box,
    .pie {
        border: 2px solid #f2b400;
        border-radius: 8px;
        box-sizing: border-box;
    }

    .titulo-box {
        text-align: center;
        font-weight: bold;
        padding-top: 12px;
        font-size: 14px;
        line-height: 18px;
    }

    .datos-box {
        padding: 8px 12px;
        font-weight: bold;
        font-size: 13px;
        line-height: 28px;
    }

    .datos-box input {
        width: 95px;
    }

    .sucursal-box {
        margin-top: 6px;
        width: 100%;
        padding: 8px 12px;
        font-weight: bold;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 30px;
    }

    .sucursal-box select {
        border: none;
        outline: none;
        font-weight: bold;
        font-size: 13px;
        background: transparent;
    }

    .hoja input {
        border: none;
        outline: none;
        font-weight: bold;
        font-size: 13px;
        background: transparent;
    }

    .texto {
        margin-top: 30px;
        margin-left: 65px;
        font-weight: bold;
        font-size: 12px;
    }

    textarea {
        width: calc(100% - 80px);
        height: 820px;
        margin: 15px 40px 0 40px;
        border: none;
        outline: none;
        resize: none;
        font-size: 15px;
        font-family: Arial, Helvetica, sans-serif;
    }

    .pie {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-top: 10px;
        padding: 5px 8px;
        font-weight: bold;
        font-size: 12px;
    }

    .pie input {
        width: 250px;
    }

    .btn-generar {
        margin-top: 15px;
        width: 100%;
        padding: 14px;
        background: #111;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-generar:hover {
        background: #333;
    }
</style>

<form class="hoja" action="{{ url_for('operadores.generar') }}" method="post" onsubmit="prepararPaginas()">

    <div class="encabezado">
        <div class="logo-box">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Alberdi">
        </div>

        <div class="titulo-box">
            INFORME<br>
            CENTRAL DE MONITOREO
        </div>

        <div class="datos-box">
            Nº: <input type="text" name="nro" value="{{ nro_preview }}" readonly><br>
            FECHA: <input type="date" name="fecha" required><br>
            HORA: <input type="time" name="hora" required>
        </div>
    </div>

    <div class="sucursal-box">

        <div>
            <label><strong>SUCURSAL:</strong></label>
            <select name="sucursal" required>
                <option value="">Seleccione una sucursal</option>
                <option value="Administracion">Administracion</option>

                {% for i in range(1, 30) %}
                    <option value="Comodin {{ i }}">Comodin {{ i }}</option>
                {% endfor %}

                <option value="Mayorista 2">Mayorista 2</option>
                <option value="Centro de Distribucion">Centro de Distribucion</option>

                {% for i in range(1, 7) %}
                    <option value="Botica {{ i }}">Botica {{ i }}</option>
                {% endfor %}

                <option value="Sino Motors 1">Sino Motors 1</option>
                <option value="Sino Motors 2">Sino Motors 2</option>
            </select>
        </div>

        <div>
            <label><strong>Tipo de Informe:</strong></label>
            <select name="tipo_informe" required style="border:none; font-weight:bold; background:transparent;">
                <option value="">Seleccionar</option>
                <option value="Hurto">Hurto</option>
                <option value="Personal interno y externo">Personal interno y externo</option>
                <option value="Consumo">Consumo</option>
                <option value="Catastrofes">Catastrofes</option>
                <option value="Rotura">Rotura</option>
                <option value="Desperfecto Tecnico">Desperfecto Tecnico</option>
                <option value="Accidente">Accidente</option>
            </select>
        </div>

    </div>

    <div class="texto">
        Por la presente se informa que:
    </div>

    <textarea name="mensaje" id="mensaje" required></textarea>

    <input type="hidden" name="mensajes_paginas" id="mensajes_paginas">

    <div class="pie">

        <div>
            Operador:
            <input type="text" name="operador"
                value="{% if session.get('usuario_nombre') == 'MedinaJ' %}Operador 01{% elif session.get('usuario_nombre') == 'NievesA' %}Operador 02{% elif session.get('usuario_nombre') == 'MartinezP' %}Operador 03{% elif session.get('usuario_nombre') == 'FigueroaG' %}Operador 04{% elif session.get('usuario_nombre') == 'AyardeG' %}Operador 05{% elif session.get('usuario_nombre') == 'MoralesM' %}Operador 06{% elif session.get('usuario_nombre') == 'LizrragaJ' %}Operador 07{% elif session.get('usuario_nombre') == 'BarcontiJ' %}Operador 08{% elif session.get('usuario_nombre') == 'marcoso' %}Administrador{% endif %}"
                readonly>
        </div>

        <div>
            Para:
            <select name="para" required>
                <option value="">Seleccione una opción</option>
                <option value="Personal">Personal</option>
                <option value="RR HH">RR HH</option>
                <option value="Directorio">Directorio</option>
                <option value="Gerencia">Gerencia</option>
                <option value="Gerencia CCTV">Gerencia CCTV</option>
                <option value="Auditoria">Auditoria</option>
                <option value="Tesoreria">Tesoreria</option>
            </select>
        </div>

    </div>

    <button type="submit" class="btn-generar">
        Generar y Descargar PDF
    </button>

</form>

<script>
function prepararPaginas() {
    const textarea = document.getElementById("mensaje");
    const hidden = document.getElementById("mensajes_paginas");

    const texto = textarea.value.trim();

    /*
      Ajustá este número si querés:
      - Menor número = más páginas, menos texto por hoja
      - Mayor número = menos páginas, más texto por hoja
    */
    const maxCaracteresPorHoja = 2800;

    let paginas = [];

    for (let i = 0; i < texto.length; i += maxCaracteresPorHoja) {
        paginas.push(texto.substring(i, i + maxCaracteresPorHoja));
    }

    hidden.value = JSON.stringify(paginas);
}
</script>

{% endblock %}
